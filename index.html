<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruler">
<meta name="color-scheme" content="light dark">
<title>在线标尺</title>
<style>
:root{
  --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6571; --panel:#ffffff; --border:#d5dae0;
  --accent:#d6336c; --accent-soft:rgba(214,51,108,.16);
  --ruler-bg:#fff4c2; --ink:#1b1f24; --warn-bg:#fff1d6; --warn-fg:#6b4300; --warn-border:#f0c36d;
  --btn:#eef1f4; --btn-fg:#1b1f24;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171b; --fg:#e8ebef; --muted:#9aa5b1; --panel:#1d2227; --border:#333b44;
    --accent:#ff6b9c; --accent-soft:rgba(255,107,156,.2);
    --ruler-bg:#2b2a1a; --ink:#f1ecd0; --warn-bg:#3a2c10; --warn-fg:#ffd98a; --warn-border:#7a5a1a;
    --btn:#2a3138; --btn-fg:#e8ebef;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh; min-height:100dvh;
  -webkit-text-size-adjust:100%;
}
#ruler{position:fixed;top:0;left:0;z-index:5;touch-action:none;cursor:crosshair;display:block}
body.o-h #ruler{width:100%;height:100px}
body.o-v #ruler{height:100%;width:100px}
main{
  padding:12px max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  max-width:900px;
}
body.o-h main{padding-top:112px;margin:0 auto}
body.o-v main{padding-left:112px;margin:0}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:18px;margin:0}
.actions{display:flex;gap:6px}
button,select,input{font:inherit;color:inherit}
button{
  background:var(--btn);color:var(--btn-fg);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px;
}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
select,input[type=number]{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-height:34px;max-width:100%;
}
.readout{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-variant-numeric:tabular-nums;
}
.readout span{word-break:break-word}
.banner{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-border);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.row label{color:var(--muted);font-size:14px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:4px 0}
.err{color:var(--accent);font-size:13px;margin:4px 0}
[hidden]{display:none !important}
body.panel-closed #panelBody{display:none}
footer.note{color:var(--muted);font-size:12.5px;margin:4px 2px 0}
.tools{margin:0 0 8px}
.readout button,.banner button{white-space:nowrap}
body.move #ruler{cursor:grab}
body.move #moveBtn{background:var(--accent-soft);border-color:var(--accent)}
.banner{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.banner.info{background:var(--panel);color:var(--fg);border-color:var(--border)}
.banner button{min-height:28px;padding:2px 8px;flex:none}
</style>
</head>
<body class="o-h">
<canvas id="ruler" aria-label="ruler"></canvas>

<main id="main">
  <header class="bar">
    <h1 data-i18n="title">在线标尺</h1>
    <div class="actions">
      <button id="langBtn" type="button"></button>
      <button id="panelBtn" type="button" data-i18n="settings">设置</button>
    </div>
  </header>

  <div id="readout" class="readout" aria-live="polite">
    <span id="readoutText"></span>
    <button id="clearCur" type="button" data-i18n="clear" hidden>清除</button>
  </div>

  <div class="row tools">
    <button id="moveBtn" type="button" aria-pressed="false">移动标尺（对齐起点）</button>
    <button id="originReset" type="button" data-i18n="originReset" hidden>起点归零</button>
  </div>

  <div id="banners"></div>

  <div id="panelBody">
    <section class="card" id="deviceCard" hidden>
      <h2 data-i18n="deviceTitle">手机机型</h2>
      <div class="row">
        <select id="deviceSel" aria-label="device"></select>
      </div>
      <p class="hint" data-i18n="deviceHint">选对机型后无需校准。预设值 = 460 PPI ÷ 3 = 153.33 CSS PPI。</p>
    </section>

    <section class="card">
      <h2 data-i18n="ppiTitle">每英寸像素数（PPI，CSS 像素）</h2>
      <div class="row">
        <button id="ppiM1" type="button">−1</button>
        <button id="ppiM01" type="button">−0.1</button>
        <input id="ppiInput" type="number" step="0.1" min="20" max="1200" inputmode="decimal" aria-label="PPI">
        <button id="ppiP01" type="button">+0.1</button>
        <button id="ppiP1" type="button">+1</button>
      </div>
      <div class="row">
        <span class="tag" id="ppiSrc"></span>
        <button id="ppiReset" type="button" data-i18n="resetCal">恢复默认 / 预设</button>
      </div>
    </section>

    <section class="card" id="calibCard">
      <h2 data-i18n="calibTitle">校准</h2>
      <div class="tabs" role="tablist">
        <button id="tabRef" type="button" role="tab" aria-selected="true" data-i18n="calibRef">实物对比</button>
        <button id="tabDiag" type="button" role="tab" aria-selected="false" data-i18n="calibDiag">屏幕尺寸</button>
      </div>

      <div id="paneRef">
        <div class="row">
          <label for="refSel" data-i18n="refLabel">参照物</label>
          <select id="refSel">
            <option value="card" data-i18n="refCard">信用卡（85.6 mm）</option>
            <option value="a4" data-i18n="refA4">A4 长边（297 mm）</option>
            <option value="letter" data-i18n="refLetter">Letter 长边（11 英寸）</option>
            <option value="custom" data-i18n="refCustom">自定义长度（mm）</option>
          </select>
          <input id="refCustom" type="number" step="0.1" min="10" value="100" inputmode="decimal" hidden aria-label="mm">
        </div>
        <div class="row">
          <button id="calStart" class="primary" type="button" data-i18n="calStart">开始对比</button>
        </div>
        <div id="calRun" hidden>
          <p class="hint" data-i18n="calHelp"></p>
          <div class="row">
            <button id="calM" type="button">−</button>
            <button id="calP" type="button">+</button>
            <span id="calLen" class="tag"></span>
          </div>
          <div class="row">
            <button id="calSave" class="primary" type="button" data-i18n="save">保存</button>
            <button id="calCancel" type="button" data-i18n="cancel">取消</button>
          </div>
        </div>
        <p id="calErr" class="err" hidden></p>
      </div>

      <div id="paneDiag" hidden>
        <div class="row">
          <label for="diagInput" data-i18n="diagLabel">屏幕对角线（英寸）</label>
          <input id="diagInput" type="number" step="0.1" min="3" max="120" value="15.6" inputmode="decimal">
          <button id="diagApply" class="primary" type="button" data-i18n="diagApply">按此尺寸设置</button>
        </div>
        <p class="hint" id="diagInfo"></p>
        <p class="hint" id="diagResult"></p>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="optTitle">显示选项</h2>
      <div class="row">
        <label for="divSel" data-i18n="division">英寸分度</label>
        <select id="divSel">
          <option value="8">1/8</option>
          <option value="16">1/16</option>
          <option value="32">1/32</option>
        </select>
        <label for="orientSel" data-i18n="orient">标尺方向</label>
        <select id="orientSel">
          <option value="auto" data-i18n="orientAuto">自动</option>
          <option value="h" data-i18n="orientH">水平</option>
          <option value="v" data-i18n="orientV">垂直</option>
        </select>
      </div>
      <div class="row">
        <label><input id="flipChk" type="checkbox"> <span data-i18n="flip">翻转（公制与英制位置互换）</span></label>
      </div>
      <div class="row">
        <button id="resetAll" type="button" data-i18n="resetAll">清除所有保存的数据</button>
      </div>
    </section>

    <footer class="note" data-i18n="note"></footer>
  </div>
</main>

  /* ---------- device data (iPhone 15–17, all 460 PPI, DPR 3) ---------- */
  var DEVICES = [
    { id: 'iphone-17-pro-max', name: 'iPhone 17 Pro Max', diag: 6.9, w: 440, h: 956, dpr: 3, ppi: 460 },
    { id: 'iphone-17-pro',     name: 'iPhone 17 Pro',     diag: 6.3, w: 402, h: 874, dpr: 3, ppi: 460 },
    { id: 'iphone-17',         name: 'iPhone 17',         diag: 6.3, w: 402, h: 874, dpr: 3, ppi: 460 },
    { id: 'iphone-air',        name: 'iPhone Air',        diag: 6.5, w: 420, h: 912, dpr: 3, ppi: 460 },
    { id: 'iphone-16-pro-max', name: 'iPhone 16 Pro Max', diag: 6.9, w: 440, h: 956, dpr: 3, ppi: 460 },
    { id: 'iphone-16-pro',     name: 'iPhone 16 Pro',     diag: 6.3, w: 402, h: 874, dpr: 3, ppi: 460 },
    { id: 'iphone-16-plus',    name: 'iPhone 16 Plus',    diag: 6.7, w: 430, h: 932, dpr: 3, ppi: 460 },
    { id: 'iphone-16',         name: 'iPhone 16',         diag: 6.1, w: 393, h: 852, dpr: 3, ppi: 460 },
    { id: 'iphone-16e',        name: 'iPhone 16e',        diag: 6.1, w: 390, h: 844, dpr: 3, ppi: 460 },
    { id: 'iphone-15-pro-max', name: 'iPhone 15 Pro Max', diag: 6.7, w: 430, h: 932, dpr: 3, ppi: 460 },
    { id: 'iphone-15-plus',    name: 'iPhone 15 Plus',    diag: 6.7, w: 430, h: 932, dpr: 3, ppi: 460 },
    { id: 'iphone-15-pro',     name: 'iPhone 15 Pro',     diag: 6.1, w: 393, h: 852, dpr: 3, ppi: 460 },
    { id: 'iphone-15',         name: 'iPhone 15',         diag: 6.1, w: 393, h: 852, dpr: 3, ppi: 460 }
  ];
  var DEFAULT_DEVICE = 'iphone-16-pro';
  var BAND = 100;               // ruler band thickness in CSS px
  var DEFAULT_PPI = 96;
  var REFS = { card: 85.6, a4: 297, letter: 279.4 };

  /* ---------- storage ---------- */
  var KEY = 'ruler.v1';
  var memStore = null;
  var S = { lang: 'zh', deviceId: null, cal: {}, div: 16, flip: false, orient: 'auto', tipDismissed: false };
  (function loadStore() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = memStore; }
    if (raw && typeof raw === 'object') {
      if (raw.lang === 'en' || raw.lang === 'zh') S.lang = raw.lang;
      if (typeof raw.deviceId === 'string') S.deviceId = raw.deviceId;
      if (raw.cal && typeof raw.cal === 'object') S.cal = raw.cal;
      if ([8, 16, 32].indexOf(raw.div) >= 0) S.div = raw.div;
      S.flip = !!raw.flip;
      S.tipDismissed = !!raw.tipDismissed;
      if (['auto', 'h', 'v'].indexOf(raw.orient) >= 0) S.orient = raw.orient;
    }
  })();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memStore = JSON.parse(JSON.stringify(S)); }
  }

  /* ---------- environment ---------- */
  var ua = navigator.userAgent || '';
  function scrMin() { return Math.min(screen.width, screen.height); }
  function scrMax() { return Math.max(screen.width, screen.height); }
  var isIPhone = /iPhone/.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) <= 500);
  var desktopMode = isIPhone && !/iPhone/.test(ua);
  function getDpr() { return window.devicePixelRatio || 1; }
  function touchSmall() {
    return isIPhone || (window.matchMedia('(pointer:coarse)').matches && Math.min(innerWidth, innerHeight) < 700);
  }
  function screenKey() {
    var d = getDpr();
    var a = Math.round(screen.width * d), b = Math.round(screen.height * d);
    return Math.max(a, b) + 'x' + Math.min(a, b);
  }

  function findDevice(id) {
    for (var i = 0; i < DEVICES.length; i++) if (DEVICES[i].id === id) return DEVICES[i];
    return null;
  }
  function curDevice() {
    var d = findDevice(S.deviceId);
    if (d) return d;
    for (var i = 0; i < DEVICES.length; i++) {
      if (DEVICES[i].w === scrMin() && DEVICES[i].h === scrMax()) return DEVICES[i];
    }
    return findDevice(DEFAULT_DEVICE);
  }
  function curKey() { return isIPhone ? 'ios:' + curDevice().id : screenKey(); }

  /* current CSS pixels per inch and where it came from */
  function getPpi() {
    var c = S.cal[curKey()];
    if (c && c.ppiDev > 0) {
      return { css: c.ppiDev / getDpr(), src: c.type === 'diag' ? 'srcDiag' : 'srcManual' };
    }
    if (isIPhone) {
      var d = curDevice();
      return { css: d.ppi / d.dpr, src: 'srcPreset' };
    }
    return { css: DEFAULT_PPI, src: 'srcDefault' };
  }
  function setCal(ppiCss, type) {
    S.cal[curKey()] = { ppiDev: ppiCss * getDpr(), type: type || 'manual' };
    save();
  }

  function curOrient() {
    if (S.orient === 'h' || S.orient === 'v') return S.orient;
    var land = innerWidth > innerHeight;
    return touchSmall() ? (land ? 'h' : 'v') : 'h';
  }

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function t(key, p) {
    var s = (I18N[S.lang] && I18N[S.lang][key]) || I18N.zh[key] || key;
    if (p) for (var k in p) s = s.split('{' + k + '}').join(p[k]);
    return s;
  }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  var canvas = $('ruler');
  var ctx = canvas.getContext('2d');
  var orient = 'h';
  var cursors = [];
  var hover = null;
  var dragIdx = -1;
  var calib = { on: false, L: 0, tab: 'ref' };
  var origin = 0;          // CSS px from the viewport edge to the ruler's 0 mark
  var moveMode = false;
  var moveStart = null;

  function axisLen() {
    var r = canvas.getBoundingClientRect();
    return orient === 'h' ? r.width : r.height;
  }

  function clampOrigin(v) { return Math.max(0, Math.min(Math.max(0, axisLen() - 24), v)); }
  function syncTools() {
    document.body.classList.toggle('move', moveMode);
    $('moveBtn').setAttribute('aria-pressed', moveMode ? 'true' : 'false');
    $('moveBtn').textContent = t(moveMode ? 'moveOn' : 'moveOff');
    $('originReset').hidden = !(origin > 0);
  }

  /* ---------- drawing ---------- */
  function draw() {
    var rect = canvas.getBoundingClientRect();
    var horiz = orient === 'h';
    var dpr = getDpr();
    var W = Math.max(1, Math.round(rect.width * dpr));
    var H = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    var ink = cssVar('--ink'), bg = cssVar('--ruler-bg'), accent = cssVar('--accent'), soft = cssVar('--accent-soft');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var ppi = getPpi().css;
    var axis = horiz ? rect.width : rect.height;
    var o = origin;
    var cross = horiz ? rect.height : rect.width;
    var P = function (v) { return Math.round(v * dpr); };
    var tw = Math.max(1, Math.round(dpr * 0.9));

    function bar(a, cFrom, cLen, w) {
      var ad = P(a) - Math.floor(w / 2), cd = P(cFrom), cl = P(cLen);
      if (horiz) ctx.fillRect(ad, cd, w, cl); else ctx.fillRect(cd, ad, cl, w);
    }
    function tick(side, a, len) {
      bar(a, side === 'start' ? 0 : cross - len, len, tw);
    }
    function label(side, a, len, text, isZero) {
      ctx.font = Math.round(12 * dpr) + 'px system-ui,-apple-system,"Segoe UI",sans-serif';
      var start = side === 'start';
      if (horiz) {
        ctx.textAlign = isZero ? 'left' : 'center';
        ctx.textBaseline = start ? 'top' : 'bottom';
        ctx.fillText(text, P(a + (isZero ? 3 : 0)), P(start ? len + 3 : cross - len - 3));
      } else {
        ctx.textBaseline = isZero ? 'top' : 'middle';
        ctx.textAlign = start ? 'left' : 'right';
        ctx.fillText(text, P(start ? len + 4 : cross - len - 4), P(a + (isZero ? (start ? 2 : 18) : 0)));
      }
    }

    var metricSide = S.flip ? 'end' : 'start';
    var inchSide = S.flip ? 'start' : 'end';
    if (o > 0) {
      ctx.globalAlpha = 0.08; ctx.fillStyle = ink;
      if (horiz) ctx.fillRect(0, 0, P(o), H); else ctx.fillRect(0, 0, W, P(o));
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = ink;

    // metric: millimetres
    var pxPerMm = ppi / 25.4;
    var skipMm = pxPerMm < 3;
    for (var n = 0; o + n * pxPerMm <= axis + 0.5; n++) {
      if (skipMm && n % 5 !== 0) continue;
      var a = o + n * pxPerMm;
      var len = n % 10 === 0 ? 28 : (n % 5 === 0 ? 20 : 11);
      tick(metricSide, a, len);
      if (n % 10 === 0) label(metricSide, a, len, n === 0 ? '0 cm' : String(n / 10), n === 0);
    }

    // inches
    var d = S.div;
    while (d > 1 && ppi / d < 4) d = d / 2;
    var lens = [30, 24, 18, 13, 9, 6];
    for (var k = 0; o + k * ppi / d <= axis + 0.5; k++) {
      var pos = o + k * ppi / d;
      var lvl = 5;
      if (k % d === 0) lvl = 0;
      else {
        for (var j = 1; j <= 5; j++) {
          var step = d / Math.pow(2, j);
          if (step < 1) break;
          if (k % step === 0) { lvl = j; break; }
        }
      }
      tick(inchSide, pos, lens[lvl]);
      if (lvl === 0) label(inchSide, pos, lens[lvl], k === 0 ? '0 in' : String(k / d), k === 0);
    }

    // zero marker (only when the ruler has been moved)
    if (o > 0 || moveMode) {
      ctx.fillStyle = accent;
      bar(o, 0, cross, Math.max(2, Math.round(dpr * 1.5)));
    }

    // calibration segment
    if (calib.on) {
      ctx.fillStyle = soft;
      if (horiz) ctx.fillRect(P(o), 0, P(o + calib.L) - P(o), H); else ctx.fillRect(0, P(o), W, P(o + calib.L) - P(o));
      ctx.fillStyle = accent;
      bar(o + calib.L, 0, cross, Math.max(2, Math.round(dpr * 2)));
    }

    // cursors
    if (cursors.length === 2) {
      var lo = Math.min(cursors[0], cursors[1]), hi = Math.max(cursors[0], cursors[1]);
      ctx.fillStyle = soft;
      if (horiz) ctx.fillRect(P(lo), 0, P(hi) - P(lo), H); else ctx.fillRect(0, P(lo), W, P(hi) - P(lo));
    }
    ctx.fillStyle = accent;
    for (var i = 0; i < cursors.length; i++) bar(cursors[i], 0, cross, Math.max(2, Math.round(dpr * 1.5)));
    if (hover !== null && !calib.on && dragIdx < 0) {
      ctx.globalAlpha = 0.6;
      bar(hover, 0, cross, Math.max(1, Math.round(dpr)));
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- readout ---------- */
  function fmtLen(px) {
    var ppi = getPpi().css;
    var mm = px * 25.4 / ppi, inch = mm / 25.4, div = S.div;
    var n = Math.round(inch * div), whole = Math.floor(n / div), r = n % div, frac = '';
    if (r) { var g = gcd(r, div); frac = (r / g) + '/' + (div / g); }
    var approx = (whole ? whole + (frac ? ' ' : '') : '') + frac;
    if (!approx) approx = '0';
    return mm.toFixed(1) + ' mm · ' + (mm / 10).toFixed(2) + ' cm · ' + inch.toFixed(3) + ' in (≈ ' + approx + '")';
  }
  function updateReadout() {
    var txt;
    if (moveMode) txt = t('moveHint', { mm: (origin * 25.4 / getPpi().css).toFixed(1) });
    else if (cursors.length === 2) txt = t('dist') + '：' + fmtLen(Math.abs(cursors[1] - cursors[0]));
    else if (cursors.length === 1) txt = t('here') + '：' + fmtLen(cursors[0] - origin);
    else if (hover !== null && !calib.on) txt = t('here') + '：' + fmtLen(hover - origin);
    else txt = t('readoutHint');
    if (S.lang === 'en') txt = txt.replace('：', ': ');
    $('readoutText').textContent = txt;
    $('clearCur').hidden = cursors.length === 0;
  }

  /* ---------- banners ---------- */
  function renderBanners() {
    var list = [];
    var ppi = getPpi();
    if (!isIPhone && ppi.src === 'srcDefault') {
      var others = Object.keys(S.cal).filter(function (k) { return k.indexOf('ios:') !== 0; }).length;
      list.push(t(others ? 'warnOtherScreen' : 'warnUncal'));
    }
    if (isIPhone) {
      var d = curDevice();
      if (ppi.src === 'srcPreset' && (scrMin() !== d.w || scrMax() !== d.h)) {
        list.push(t('warnMismatch', { a: scrMin(), b: scrMax(), c: Math.min(d.w, d.h), d: Math.max(d.w, d.h) }));
      }
      if (desktopMode) list.push(t('warnDesktop'));
    }
    var vv = window.visualViewport;
    if (vv && Math.abs(vv.scale - 1) > 0.02) list.push(t('warnZoom', { s: vv.scale.toFixed(2) + '×' }));
    var items = list.map(function (m) { return { text: m }; });
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (touchSmall() && !standalone && !S.tipDismissed) items.push({ text: t('tipChrome'), info: true });
    var box = $('banners');
    box.innerHTML = '';
    items.forEach(function (it) {
      var el = document.createElement('div');
      el.className = 'banner' + (it.info ? ' info' : '');
      var sp = document.createElement('span');
      sp.textContent = it.text;
      el.appendChild(sp);
      if (it.info) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = t('close');
        b.addEventListener('click', function () { S.tipDismissed = true; save(); renderBanners(); });
        el.appendChild(b);
      }
      box.appendChild(el);
    });
  }

  /* ---------- panel UI ---------- */
  function renderPpiUI() {
    var p = getPpi();
    var inp = $('ppiInput');
    if (document.activeElement !== inp) inp.value = p.css.toFixed(1);
    $('ppiSrc').textContent = t(p.src);
    $('calLen').textContent = t('calLen', { px: calib.L.toFixed(1) });
    updateDiagInfo();
  }
  function updateDiagInfo() {
    var diag = parseFloat($('diagInput').value);
    $('diagInfo').textContent = t('diagInfo', { w: screen.width, h: screen.height, dpr: getDpr().toFixed(2).replace(/\.?0+$/, '') });
    if (diag > 0) {
      var ppi = Math.hypot(screen.width, screen.height) / diag;
      $('diagResult').textContent = t('diagResult', {
        wcm: (screen.width / ppi * 2.54).toFixed(1),
        hcm: (screen.height / ppi * 2.54).toFixed(1),
        ppi: ppi.toFixed(1)
      });
    } else $('diagResult').textContent = '';
  }
  function applyLang() {
    document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
    document.title = t('title');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    $('langBtn').textContent = t('switchTo');
  }
  function buildDeviceSelect() {
    var sel = $('deviceSel');
    sel.innerHTML = '';
    DEVICES.forEach(function (d) {
      var o = document.createElement('option');
      o.value = d.id;
      o.textContent = d.name + (d.id === DEFAULT_DEVICE ? ' ★' : '');
      sel.appendChild(o);
    });
    sel.value = curDevice().id;
  }

  function applyOrient() {
    var o = curOrient();
    if (o !== orient) { cursors = []; hover = null; origin = 0; if (calib.on) stopCalib(); }
    orient = o;
    document.body.classList.toggle('o-h', o === 'h');
    document.body.classList.toggle('o-v', o === 'v');
  }

  function renderAll() {
    applyOrient();
    origin = clampOrigin(origin);
    syncTools();
    draw();
    renderPpiUI();
    renderBanners();
    updateReadout();
  }

  /* ---------- calibration ---------- */
  function refMm() {
    var v = $('refSel').value;
    if (v === 'custom') return parseFloat($('refCustom').value) || 0;
    return REFS[v];
  }
  function showCalErr(msg) {
    var el = $('calErr');
    el.textContent = msg || '';
    el.hidden = !msg;
  }
  function startCalib() {
    var mm = refMm();
    if (!(mm > 0)) return;
    var L = mm / 25.4 * getPpi().css;
    if (L > axisLen() - origin - 6) { showCalErr(t('tooLong')); return; }
    showCalErr('');
    cursors = []; hover = null;
    calib.on = true; calib.L = L;
    $('calRun').hidden = false;
    $('calStart').hidden = true;
    renderAll();
  }
  function stopCalib() {
    calib.on = false;
    $('calRun').hidden = true;
    $('calStart').hidden = false;
  }
  function nudgeCalib(devPx) {
    if (!calib.on) return;
    calib.L = Math.max(10, Math.min(axisLen() - origin - 2, calib.L + devPx / getDpr()));
    draw(); renderPpiUI();
  }
  function saveCalib() {
    var mm = refMm();
    if (!calib.on || !(mm > 0)) return;
    setCal(calib.L * 25.4 / mm, 'manual');
    stopCalib();
    renderAll();
  }

  /* ---------- pointer handling on the ruler ---------- */
  function along(e) {
    var r = canvas.getBoundingClientRect();
    return orient === 'h' ? e.clientX - r.left : e.clientY - r.top;
  }
  function clampAxis(p) { return Math.max(0, Math.min(axisLen(), p)); }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var p = clampAxis(along(e));
    if (moveMode) {
      moveStart = { p: along(e), o: origin };
      dragIdx = -3;
    } else if (calib.on) {
      calib.L = Math.max(10, p - origin);
      dragIdx = -2;
    } else {
      var best = -1, bestD = 16;
      for (var i = 0; i < cursors.length; i++) {
        var dd = Math.abs(cursors[i] - p);
        if (dd < bestD) { bestD = dd; best = i; }
      }
      if (best < 0) {
        if (cursors.length < 2) { cursors.push(p); best = cursors.length - 1; }
        else {
          best = Math.abs(cursors[0] - p) <= Math.abs(cursors[1] - p) ? 0 : 1;
          cursors[best] = p;
        }
      }
      dragIdx = best;
    }
    draw(); renderPpiUI(); updateReadout();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = clampAxis(along(e));
    if (dragIdx === -3 && moveStart) { origin = clampOrigin(moveStart.o + along(e) - moveStart.p); syncTools(); }
    else if (dragIdx === -2 && calib.on) calib.L = Math.max(10, p - origin);
    else if (dragIdx >= 0) cursors[dragIdx] = p;
    else hover = (e.pointerType === 'mouse' && !moveMode) ? p : null;
    draw(); renderPpiUI(); updateReadout();
  });
  function endDrag() { dragIdx = -1; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function () {
    if (dragIdx === -1) { hover = null; draw(); updateReadout(); }
  });

  window.addEventListener('keydown', function (e) {
    if (!calib.on) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    var step = e.shiftKey ? 10 : 1, dir = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') dir = 1;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') dir = -1;
    if (dir) { e.preventDefault(); nudgeCalib(dir * step); }
  });

  /* ---------- wire up controls ---------- */
  $('langBtn').addEventListener('click', function () {
    S.lang = S.lang === 'zh' ? 'en' : 'zh'; save(); applyLang(); renderAll();
  });
  $('panelBtn').addEventListener('click', function () {
    document.body.classList.toggle('panel-closed');
  });
  $('clearCur').addEventListener('click', function () { cursors = []; draw(); updateReadout(); });
  $('moveBtn').addEventListener('click', function () {
    moveMode = !moveMode; hover = null; syncTools(); draw(); updateReadout();
  });
  $('originReset').addEventListener('click', function () {
    origin = 0; syncTools(); draw(); updateReadout(); renderPpiUI();
  });

  $('deviceSel').addEventListener('change', function (e) {
    S.deviceId = e.target.value; save(); renderAll();
  });

  function ppiBump(delta) {
    var v = getPpi().css + delta;
    v = Math.max(20, Math.min(1200, v));
    setCal(v, 'manual'); renderAll();
  }
  $('ppiM1').addEventListener('click', function () { ppiBump(-1); });
  $('ppiM01').addEventListener('click', function () { ppiBump(-0.1); });
  $('ppiP01').addEventListener('click', function () { ppiBump(0.1); });
  $('ppiP1').addEventListener('click', function () { ppiBump(1); });
  $('ppiInput').addEventListener('change', function (e) {
    var v = parseFloat(e.target.value);
    if (v >= 20 && v <= 1200) setCal(v, 'manual');
    renderAll();
  });
  $('ppiReset').addEventListener('click', function () {
    delete S.cal[curKey()]; save(); renderAll();
  });

  function setTab(name) {
    calib.tab = name;
    $('tabRef').setAttribute('aria-selected', name === 'ref');
    $('tabDiag').setAttribute('aria-selected', name === 'diag');
    $('paneRef').hidden = name !== 'ref';
    $('paneDiag').hidden = name !== 'diag';
    if (name !== 'ref' && calib.on) { stopCalib(); renderAll(); }
  }
  $('tabRef').addEventListener('click', function () { setTab('ref'); });
  $('tabDiag').addEventListener('click', function () { setTab('diag'); });

  $('refSel').addEventListener('change', function () {
    $('refCustom').hidden = $('refSel').value !== 'custom';
    showCalErr('');
    if (calib.on) { stopCalib(); renderAll(); }
  });
  $('refCustom').addEventListener('input', function () { if (calib.on) { stopCalib(); renderAll(); } });
  $('calStart').addEventListener('click', startCalib);
  $('calM').addEventListener('click', function () { nudgeCalib(-1); });
  $('calP').addEventListener('click', function () { nudgeCalib(1); });
  $('calSave').addEventListener('click', saveCalib);
  $('calCancel').addEventListener('click', function () { stopCalib(); renderAll(); });

  $('diagInput').addEventListener('input', updateDiagInfo);
  $('diagApply').addEventListener('click', function () {
    var diag = parseFloat($('diagInput').value);
    if (!(diag > 0)) return;
    setCal(Math.hypot(screen.width, screen.height) / diag, 'diag');
    renderAll();
  });

  $('divSel').addEventListener('change', function (e) {
    S.div = parseInt(e.target.value, 10); save(); renderAll();
  });
  $('orientSel').addEventListener('change', function (e) {
    S.orient = e.target.value; save(); renderAll();
  });
  $('flipChk').addEventListener('change', function (e) {
    S.flip = e.target.checked; save(); renderAll();
  });
  $('resetAll').addEventListener('click', function () {
    if (!window.confirm(t('confirmReset'))) return;
    S.cal = {}; S.deviceId = null; S.tipDismissed = false; save(); buildDeviceSelect(); renderAll();
  });

  /* ---------- environment change listeners ---------- */
  var raf = 0;
  function scheduleRender() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { raf = 0; renderAll(); });
  }
  window.addEventListener('resize', scheduleRender);
  window.addEventListener('orientationchange', function () { setTimeout(scheduleRender, 120); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleRender);
  }
  if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(canvas);
  if (window.matchMedia) {
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    if (dark.addEventListener) dark.addEventListener('change', draw);
    var watchDpr = function () {
      var mq = window.matchMedia('(resolution: ' + getDpr() + 'dppx)');
      var h = function () { scheduleRender(); watchDpr(); };
      if (mq.addEventListener) mq.addEventListener('change', h, { once: true });
    };
    watchDpr();
  }

  /* ---------- init ---------- */
  $('divSel').value = String(S.div);
  $('orientSel').value = S.orient;
  $('flipChk').checked = S.flip;
  $('deviceCard').hidden = !isIPhone;
  if (touchSmall()) document.body.classList.add('panel-closed');
  buildDeviceSelect();
  applyLang();
  renderAll();
  // a second pass once layout has settled (fonts, safe areas, toolbars)
  setTimeout(renderAll, 200);
})();
</script>
</body>
</html>
